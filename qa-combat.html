<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L.I.V.E. | COMBAT QA</title><link rel="stylesheet" href="qa-combat.css"></head><body>
<header><b>L.I.V.E. / COMBAT QA</b><span>계정·서버·크레딧 변경 없음 · 브라우저 단독 실험실</span><a href="qa.html">미니게임 QA ↗</a><a href="/">게임으로 ↗</a></header>
<main><section class="toolbar"><div><label>지역<select id="region"></select></label><label>시드<input id="seed" type="number" value="24004"></label><label>A 숙련도<input id="masteryA" type="number" min="1" max="20" value="1"></label><label>B 숙련도<input id="masteryB" type="number" min="1" max="20" value="1"></label><label>재생 속도<select id="speed"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option><option value="10">×10</option></select></label></div><div class="actions"><button id="start" class="primary">▶ 전투 시작</button><button id="pause">⏸ 일시정지</button><button id="step">1틱 진행</button><button id="reset">↺ 초기화</button><button id="preset">균형 편성</button><button id="wild">야생동물 편성</button><button id="batch">100회 비교</button><button id="export">결과 JSON 저장</button></div></section>
<section class="workspace"><aside><h3>편성 편집</h3><label>편집할 팀<select id="team"><option value="A">A (왼쪽)</option><option value="B">B (오른쪽)</option></select></label><label>실험체<select id="character"></select></label><label>성급<select id="star"><option>1</option><option>2</option><option>3</option></select></label><label>장비 (최대 3개)<select id="item1"></select><select id="item2"></select><select id="item3"></select></label><p class="hint">빈 칸 클릭으로 추가, 기존 실험체는 드래그로 이동·자리 교환. 기존 실험체를 클릭하면 왼쪽에서 캐릭터·성급·장비를 편집할 수 있어.</p><div class="actions edit-buttons"><button id="applyUnit">선택 실험체 수정</button><button id="removeUnit">선택 실험체 제거</button></div><div id="teams"></div></aside>
<div class="fieldwrap"><div class="topline"><strong id="status">편성 준비 중</strong><span id="clock">0.00초</span></div><div class="board" id="board"></div><p class="hint">M4 전투 엔진을 직접 사용해. 여기서는 온라인 로그인·준비시간 없이 전투·데미지·스킬·이동을 시험해.</p></div>
<aside><h3>검증 결과</h3><div id="summary">전투를 시작하면 결과가 표시돼.</div><h3>피해 기록 / 이벤트</h3><div id="events" class="events"></div><h3>실험체별 전투 분석</h3><div id="analytics"></div><h3>100회 통계</h3><div id="batchResult">미실행</div></aside></section></main>
<script src="roster.js"></script><script src="items.js"></script><script src="combat-engine.js"></script><script src="qa-combat.js"></script></body></html>
